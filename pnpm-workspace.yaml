packages:
  - lps-harness
  - web
# Native/postinstall builds. The harness needs better-sqlite3 (session DB) and
# esbuild (tsx loader) compiled to run; the rest are transitive and harmless.
allowBuilds:
  '@google/genai': true
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  sharp: true
minimumReleaseAgeExclude:
  - '@cognisphere-sh/cognisphere-harness@0.3.3 || 0.3.4 || 0.3.5 || 0.3.6 || 0.3.9 || 0.3.10 || 0.3.11 || 0.3.15'
